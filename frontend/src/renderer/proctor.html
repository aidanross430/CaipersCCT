<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Card Game Proctor</title>
    <!-- Same policy as index.html, plus connect-src so the page can open its WebSocket -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/proctor/main.tsx"></script>
  </body>
</html>
